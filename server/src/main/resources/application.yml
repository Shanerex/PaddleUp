spring:
  application:
    name: paddleup-server
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/paddleup}
    username: ${DATASOURCE_USER:paddleup}
    password: ${DATASOURCE_PASSWORD:paddleup}
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders keep startup working without Google configured; sign-in then fails.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
            redirect-uri: ${paddleup.auth.web-base-url}/api/login/oauth2/code/google
  session:
    # Flyway (V2__spring_session.sql) is the only schema owner.
    jdbc:
      initialize-schema: never
    timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health

paddleup:
  packs:
    # Directory of sport pack JSON files, read once at startup (default: the repo packs/ dir).
    dir: ${PADDLEUP_PACKS_DIR:../packs}
  auth:
    token-ttl: 15m
    max-code-attempts: 5
    web-base-url: ${PADDLEUP_WEB_BASE_URL:http://localhost:3000}
    avatar-preset-count: 12
    cookie-secure: true
    # Sliding-window sign-in limits (Postgres-backed). trusted-proxy-hops: proxies in front of the
    # server; 0 trusts only the socket peer, n reads the client from the nth-from-right
    # X-Forwarded-For entry. Default 2 = Vercel rewrite + Fly proxy (Vercel sets the client address,
    # Fly appends Vercel's); the dev profile sets 0. Too many hops falls back to the socket peer, so
    # a wrong value costs per-client buckets, never lets a client pick its own address. Check the
    # real X-Forwarded-For after deploying.
    throttle:
      start-per-email: 3
      start-per-ip: 10
      start-window: 15m
      failed-codes-per-email: 5
      failed-per-ip: 20
      failure-window: 1h
      trusted-proxy-hops: ${PADDLEUP_TRUSTED_PROXY_HOPS:2}
  rooms:
    invite-ttl: 7d
    code-length: 12
    default-min-managers: 2
    default-max-managers: 10
    web-base-url: ${paddleup.auth.web-base-url}
    # Failed invite-code attempts per window; a limit that is used up refuses every redeem, even a
    # valid code. The client address uses paddleup.auth.throttle.trusted-proxy-hops.
    join-throttle:
      failed-per-user: 5
      failed-per-ip: 20
      window: 1m
  email:
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:PaddleUp <onboarding@resend.dev>}
