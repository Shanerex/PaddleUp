services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: paddleup
      POSTGRES_USER: paddleup
      POSTGRES_PASSWORD: paddleup
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paddleup -d paddleup"]
      interval: 2s
      timeout: 3s
      retries: 30
