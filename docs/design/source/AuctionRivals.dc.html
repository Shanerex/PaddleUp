<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:2px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)">
  <sc-for list="{{ v.rivals }}" as="r" hint-placeholder-count="7">
    <div style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;opacity:{{ r.opacity }};background:{{ r.rowBg }}">
      <div style="width:36px;height:36px;border-radius:11px;background:{{ r.bg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;box-shadow:{{ r.ring }}">{{ r.id }}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;min-width:0"><span style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span><sc-if value="{{ r.leading }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--team);color:var(--on-team)">LEADING</span></sc-if><sc-if value="{{ r.offline }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)">OFFLINE</span></sc-if></div>
        <span style="font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.mgr }} · needs {{ r.needs }}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0"><span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:500">{{ r.purse }}</span><span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-2)">{{ r.squad }} pl · {{ r.os }}/8 OS</span></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:480},&quot;v&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;AuctionView&quot;}}"></script>
</body>
</html>
