<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)">
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--ink-2)">PURSE</span><span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-2)">of ₹120 Cr</span></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font-family:'DM Mono',monospace;font-size:26px;font-weight:500;letter-spacing:-0.03em">{{ v.me.purse }}</span><span style="font-size:13px;font-weight:700;color:var(--team-ink)">Max bid {{ v.me.max }}</span></div>
    <div style="height:10px;border-radius:5px;background:var(--team);display:flex;overflow:hidden"><div style="width:{{ v.me.spentPct }};background:var(--ink-3)"></div><div style="width:{{ v.me.reservePct }};background:repeating-linear-gradient(135deg,var(--warn) 0 3px,var(--warn-tint) 3px 6px)"></div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)"><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:2px;background:var(--ink-3)"></span>spent</span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:2px;background:var(--warn)"></span>reserved for minimums</span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:2px;background:var(--team)"></span>free to bid</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
    <sc-for list="{{ v.me.roles }}" as="r" hint-placeholder-count="4"><div style="border-radius:12px;padding:8px 4px;background:{{ r.bg }};display:flex;flex-direction:column;gap:2px;align-items:center"><span style="font-size:10px;font-weight:800;color:{{ r.ink }}">{{ r.label }}</span><span style="font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:{{ r.ink }}">{{ r.text }}</span></div></sc-for>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--ink-2)">Squad</span><span style="font-family:'DM Mono',monospace;font-weight:500">{{ v.me.squad }} <span style="color:var(--ink-2)">/ {{ v.me.squadRange }}</span></span></div>
  <div style="display:flex;justify-content:space-between;font-size:13px;align-items:center"><span style="color:var(--ink-2)">Overseas {{ v.me.os }}</span><span style="display:flex;gap:3px"><sc-for list="{{ v.me.osSlots }}" as="o" hint-placeholder-count="8"><span style="width:14px;height:14px;border-radius:4px;background:{{ o.bg }}"></span></sc-for></span></div>
  <sc-if value="{{ showPlayers }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px">
      <sc-for list="{{ v.me.players }}" as="p" hint-placeholder-count="6"><div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;background:{{ p.roleBg }};color:{{ p.roleInk }};width:34px;text-align:center">{{ p.role }}</span><span style="flex:1;font-size:14px;font-weight:600;min-width:0">{{ p.name }} <span style="font-weight:500;font-size:12px;color:var(--ink-2)">{{ p.tags }}</span></span><span style="font-family:'DM Mono',monospace;font-size:13px">{{ p.price }}</span></div></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:560},&quot;v&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;AuctionView&quot;},&quot;showPlayers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
