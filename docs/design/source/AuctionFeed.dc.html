<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)">
  <sc-for list="{{ v.feed }}" as="f" hint-placeholder-count="4">
    <div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:{{ f.rowBg }}">
      <div style="width:28px;height:28px;border-radius:9px;background:{{ f.bg }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex-shrink:0">{{ f.id }}</div>
      <span style="flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.name }}</span>
      <span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:{{ f.amtInk }}">{{ f.amt }}</span>
      <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-2);width:32px;text-align:right">{{ f.ago }}</span>
    </div>
  </sc-for>
  <div style="display:flex;align-items:center;gap:10px;padding:9px 10px">
    <div style="width:28px;height:28px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-family:'Material Symbols Rounded';font-size:16px;line-height:1">gavel</span></div>
    <span style="flex:1;font-size:13px;color:var(--ink-2)">Lot {{ v.lot.n }} opened at {{ v.lot.base }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:320},&quot;v&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;AuctionView&quot;}}"></script>
</body>
</html>
